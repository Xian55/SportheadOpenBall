name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: latest
      - name: Build wasm
        run: |
          emcmake cmake -S . -B ../build-web -DCMAKE_BUILD_TYPE=Release \
                        -DPLATFORM=Web -DOB_DEV_TOOLS=OFF \
                        -DOB_VERSION="${GITHUB_SHA::7}"
          cmake --build ../build-web -j"$(nproc)"
      - name: Stage site
        # CMake already names the target `index`, so Pages serves the game at
        # the site root with no rename and no redirect.
        run: |
          mkdir -p _site
          cp ../build-web/index.html ../build-web/index.js ../build-web/index.wasm _site/
          # Cache-bust: stamp the build id and version the js request. Without
          # this a phone happily serves a cached build for ages, and a stale page
          # looks exactly like a fix that did not work.
          SHA="${GITHUB_SHA::7}"
          sed -i "s/__OB_BUILD__/$SHA/g" _site/index.html
          # emscripten MINIFIES the shell and strips attribute quotes, so the tag
          # is <script async src=index.js> - match both quoted and bare forms.
          sed -i -E "s#src=\"?index\.js\"?#src=\"index.js?v=$SHA\"#g" _site/index.html
          # Hard-fail rather than warn: a silent miss here is exactly the stale-cache
          # trap this step exists to prevent.
          grep -q "index.js?v=$SHA" _site/index.html || { echo "script tag not versioned"; exit 1; }
          grep -q "OB_BUILD=\"\?$SHA" _site/index.html || { echo "build id not stamped"; exit 1; }
          echo "cache-busted at $SHA"
          # The vendored signalling bundle ships alongside (added in M4).
          [ -f web/trystero-nostr.min.js ] && cp web/trystero-nostr.min.js _site/ || true
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
