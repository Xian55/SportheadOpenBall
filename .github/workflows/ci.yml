name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', '.gitignore', '.gitattributes', 'LICENSE']
  push:
    branches-ignore: [main]
    paths-ignore: ['**.md', '.gitignore', '.gitattributes', 'LICENSE']
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System deps (raylib)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev \
                                  libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Build
        run: |
          cmake -S . -B ../build-native -DCMAKE_BUILD_TYPE=Release
          cmake --build ../build-native -j"$(nproc)"
      - name: Tier-1 purity gate
        run: ./tools/lint_sim.sh
      - name: Tests
        run: |
          B=../build-native
          for t in fixed_test const_test sim_test replay_test; do
            [ -x "$B/$t" ] && { echo "--- $t"; "$B/$t"; }
          done
          exit 0

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja git
      - name: Build
        run: |
          cmake -S . -B ../build-native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build ../build-native -j
      - name: Tests
        run: |
          B=../build-native
          for t in fixed_test const_test sim_test replay_test; do
            [ -x "$B/$t.exe" ] && { echo "--- $t"; "$B/$t.exe"; }
          done
          exit 0

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: latest
      - name: Build
        run: |
          emcmake cmake -S . -B ../build-web -DCMAKE_BUILD_TYPE=Release \
                        -DPLATFORM=Web -DOB_DEV_TOOLS=OFF
          cmake --build ../build-web -j"$(nproc)"
