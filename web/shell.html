<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The HTML is the root of the cache chain: if it is stale it hands out the
       old ?v= and the js and wasm stay stale too. GitHub Pages will not let us
       set real headers, so these are best-effort; the visible build id in the
       corner is the actual safety net. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <!-- viewport-fit=cover so the canvas reaches under a notch / rounded corners.
       user-scalable=no: pinch-zoom on a game canvas is never wanted and it
       fights the touch controls. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>SportheadOpenBall</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #12141f;
      /* Kill pull-to-refresh and rubber-band scroll: both steal drags that were
         meant for the on-screen controls. */
      overscroll-behavior: none;
    }
    canvas.emscripten {
      display: block;
      outline: none;
      /* 100vh is WRONG on mobile: it measures the viewport as if the browser
         URL bar were hidden, so the canvas ends up taller than the visible area
         and its bottom - the pitch floor and the touch controls - is cut off
         below the screen edge. dvh tracks the actually-visible height and
         follows the bar as it shows and hides. vh stays as a fallback for
         browsers without dvh. */
      width: 100vw;  height: 100vh;
      width: 100dvw; height: 100dvh;
      /* Without this, a drag on the canvas scrolls or zooms the page instead of
         reaching the game. */
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #status {
      position: fixed; top: 8px; left: 10px;
      color: #cdd3e0; font: 14px system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="status">Loading…</div>
  <canvas class="emscripten" id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <script>
    // Stamped by the Pages workflow with the commit SHA. Browsers cache the
    // wasm and js aggressively, and a stale build is indistinguishable from a
    // fix that did not work - that has already cost one debugging round.
    window.OB_BUILD = '__OB_BUILD__';

    var Module = {
      canvas: (function () { return document.getElementById('canvas'); })(),
      setStatus: function (t) { document.getElementById('status').textContent = t || ''; },
      // Version the .wasm request too: the js loader fetches it by name, so
      // busting only the script tag would still serve a stale binary.
      locateFile: function (path, prefix) {
        var v = window.OB_BUILD || '';
        return prefix + path + (v && /\.(wasm|data)$/.test(path) ? ('?v=' + v) : '');
      },
    };

    // Space and the arrow keys SCROLL THE PAGE - and the parent frame when
    // embedded in an iframe. This is the number one "your browser game feels
    // broken" bug. preventDefault only: the event still reaches GLFW.
    var swallow = { ' ': 1, ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, Tab: 1, F3: 1 };
    window.addEventListener('keydown', function (e) {
      if (swallow[e.key]) e.preventDefault();
    }, true);

    // An iframe gets no keyboard events until something inside it is focused.
    addEventListener('pointerdown', function () { Module.canvas.focus(); });
    addEventListener('load', function () { Module.canvas.focus(); });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
